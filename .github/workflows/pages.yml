name: Deploy Leaderboard
on:
  push:
    branches: [main]
    paths:
      - 'leaderboard/**'
      - 'pyproject.toml'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.11 --only-group leaderboard
      - name: Build site
        run: |
          uv run --no-sync python leaderboard/scripts/build.py --output _site/leaderboard
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>VLA benchmark results</title>
          <meta http-equiv="refresh" content="0; url=./leaderboard/">
          <p><a href="./leaderboard/">VLA benchmark results</a></p>
          HTML
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          force_orphan: true
