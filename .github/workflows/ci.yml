name: CI

on:
  push:
    branches: [main]
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  ty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv run --python 3.11 --dev ty check

  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
      - run: ruff check
      - run: ruff format --check --diff

  test-vla-eval:
    runs-on: ubuntu-latest
    name: Pytest (vla_eval)
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Install vla_eval deps
        run: uv sync --python 3.11 --all-extras --dev
        env:
          UV_TORCH_BACKEND: auto
      - name: Run pytest
        run: uv run pytest tests/

  test-leaderboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.11 --only-group leaderboard --group dev
      - run: uv run --no-sync pytest leaderboard/tests
      - run: node --test leaderboard/tests/test_site.cjs
