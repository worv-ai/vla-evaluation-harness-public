server:
  url: ws://localhost:8000
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robotwin:0.7.0
  volumes:
  - /mnt/cepheid/users/claude/scratch/vla-profile/rt-cpu/217330/lavapipe-env:/opt/lavapipe-env:ro
  - /mnt/cepheid/users/claude/scratch/vla-profile/lavapipe:/opt/lavapipe:ro
  env:
  - ROBOTWIN_LAVAPIPE_ICD=/opt/lavapipe/lvp_icd.json
  - LP_NUM_THREADS=4
render: cpu
output_dir: ./results
benchmarks:
- benchmark: vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark
  subname: adjust_bottle-demo_clean
  episodes_per_task: 1
  max_steps: 400
  action_dim: 14
  params:
    task_name: adjust_bottle
    task_config: demo_clean
    seed: 0
    instruction_type: seen
    test_num: 4
    skip_expert_check: true
