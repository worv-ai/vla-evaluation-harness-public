# RoboTwin 2.0 smoke: 4 short tasks x demo_clean x 2 episodes
# Generated by gen_robotwin.py. Expert check skipped: seeds 100000+ in order (some may be unsolvable, fine for timing).
server:
  url: "ws://localhost:8000"
docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robotwin:0.7.0
render: gpu
output_dir: "./results"
benchmarks:
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    subname: beat_block_hammer-demo_clean
    episodes_per_task: 1
    max_steps: 400
    action_dim: 14
    params: {task_name: beat_block_hammer, task_config: demo_clean, seed: 0, instruction_type: seen, test_num: 2, skip_expert_check: true}
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    subname: grab_roller-demo_clean
    episodes_per_task: 1
    max_steps: 400
    action_dim: 14
    params: {task_name: grab_roller, task_config: demo_clean, seed: 0, instruction_type: seen, test_num: 2, skip_expert_check: true}
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    subname: lift_pot-demo_clean
    episodes_per_task: 1
    max_steps: 400
    action_dim: 14
    params: {task_name: lift_pot, task_config: demo_clean, seed: 0, instruction_type: seen, test_num: 2, skip_expert_check: true}
  - benchmark: "vla_eval.benchmarks.robotwin.benchmark:RoboTwinBenchmark"
    subname: click_bell-demo_clean
    episodes_per_task: 1
    max_steps: 400
    action_dim: 14
    params: {task_name: click_bell, task_config: demo_clean, seed: 0, instruction_type: seen, test_num: 2, skip_expert_check: true}
