# Smoke evaluation for the dispatcher server — BinFill 2 ep, short
# horizon. Lets us shake out code issues before running the full
# 16-task × 10-ep grid. Recording is ON so we exercise the SQLite
# integration end-to-end.
server:
  url: "ws://DGX-H100-6:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/robomme:dev-pr191
  gpus: "all"
  env:
    - "NVIDIA_DRIVER_CAPABILITIES=all"
  volumes:
    - "/usr/share/vulkan/icd.d:/usr/share/vulkan/icd.d:ro"

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.robomme.benchmark:RoboMMEBenchmark"
    subname: smoke
    episodes_per_task: 2
    params:
      tasks: [BinFill]
      action_space: joint_angle
      max_steps: 200
    # NOTE: ``recording`` is a per-benchmark field on EvalConfig (see
    # vla_eval.config.EvalConfig.from_dict). Placing it at the top
    # level silently no-ops — orchestrator builds a NullEpisodeRecorder
    # and SQLite stays empty (only eval_metadata gets written).
    recording:
      output_dir: "./results"
      record_step: true
      record_video: true
      step_fields:
        - simple_subgoal_online
        - grounded_subgoal_online
        - reward
        - terminated
